name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"

      - name: Compile library and examples, assemble AARs and the showcase app
        working-directory: .github/ci-host
        run: gradle --no-daemon :design:compileDebugKotlin :design:assemble :showcase:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: showcase-apk
          path: .github/ci-host/showcase/build/outputs/apk/debug/showcase-debug.apk

  screenshots:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: showcase-apk
          path: .github/ci-host/showcase/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screens on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: bash .github/ci-host/screenshots.sh

      - name: Convert to WebP
        run: |
          sudo apt-get install -y -qq webp > /dev/null
          for f in screenshots/*.png; do cwebp -quiet -q 88 "$f" -o "${f%.png}.webp" && rm "$f"; done

      - uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots/

      - name: Regenerate README examples
        run: python3 .github/ci-host/readme_examples.py

      - name: Commit screenshots and README
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots README.md
          git diff --cached --quiet || { git commit -m "Update screenshots and README examples [skip ci]" && git push; }
