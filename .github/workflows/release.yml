name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Write signing config
        run: |
          mkdir -p signing
          echo "${{ secrets.SERIFU_KEYSTORE_BASE64 }}" | base64 -d > signing/serifu-release.jks
          printf 'KEYSTORE_FILE=signing/serifu-release.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=serifu\nKEY_PASSWORD=%s\n' "${{ secrets.SERIFU_SIGNING_PASSWORD }}" "${{ secrets.SERIFU_SIGNING_PASSWORD }}" > .env

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: serifu-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
