name: Release build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Write signing config
        run: |
          mkdir -p signing
          echo "${{ secrets.SERIFU_KEYSTORE_BASE64 }}" | base64 -d > signing/serifu-release.jks
          printf 'KEYSTORE_FILE=signing/serifu-release.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=serifu\nKEY_PASSWORD=%s\n' "${{ secrets.SERIFU_SIGNING_PASSWORD }}" "${{ secrets.SERIFU_SIGNING_PASSWORD }}" > .env
          # Fail closed: the decoded keystore must be the backed-up Serifu release key.
          echo "29e0ffdc6be96187fcf78a8422b8acd842c3180c6f400a7236ce5f3443f9c50c  signing/serifu-release.jks" | sha256sum -c -

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature
        env:
          KS_PASS: ${{ secrets.SERIFU_SIGNING_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          EXPECTED=$(keytool -list -v -keystore signing/serifu-release.jks -alias serifu -storepass "$KS_PASS" | awk '/SHA256:/{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$(awk '/SHA-256 digest:/{print $NF}' /tmp/apk-certs.txt | head -1 | tr 'A-F' 'a-f')
          echo "keystore cert digest: $EXPECTED"
          echo "apk signer digest:    $ACTUAL"
          test -n "$EXPECTED" && test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK signer does not match the Serifu release keystore"; exit 1; }

      - name: Stage APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" serifu-0.6.7-beta.apk
          ls -la serifu-0.6.7-beta.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: serifu-release-apk
          path: serifu-0.6.7-beta.apk
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/notes.md <<'NOTES'
          First public beta of Serifu.

          Serifu translates manga, manhua, and manhwa in place on your phone. It screenshots a reader app you choose, finds the speech bubbles, and draws English over them.

          - Japanese, Chinese, and Korean, plus Latin-script sources (English, French, Spanish, German, Italian, Portuguese)
          - On-device translation with ML Kit, or an optional OpenAI-compatible cloud backend
          - Auto and manual translate triggers, with a floating HUD over your reader

          ## Install

          1. Download `serifu-0.6.7-beta.apk` below. Requires Android 11 or newer on an arm64 phone.
          2. Allow installing from this source when Android asks.
          3. On first launch, grant the restricted settings Android requires for sideloaded accessibility apps, then enable Serifu's accessibility service.

          A one-time language pack download of about 30 MB runs on first use.

          Beta: OCR and lettering may still change between releases. If you installed an earlier debug build, uninstall it before installing this one - the signatures differ.
          NOTES
          if gh release view 0.6.7-beta >/dev/null 2>&1; then
            gh release upload 0.6.7-beta serifu-0.6.7-beta.apk --clobber
            gh release edit 0.6.7-beta --draft --title "Serifu 0.6.7-beta" --notes-file /tmp/notes.md
          else
            gh release create 0.6.7-beta --draft --title "Serifu 0.6.7-beta" --notes-file /tmp/notes.md serifu-0.6.7-beta.apk
          fi
