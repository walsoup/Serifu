name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          link-to-sdk: true

      - name: Get Bergamot submodule commit
        id: bergamot-submodule
        run: echo "sha=$(git submodule status third_party/bergamot-translator | awk '{print $1}' | tr -d '+-')" >> $GITHUB_OUTPUT

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            bergamot/.cxx
            bergamot/build
          key: bergamot-cxx-${{ runner.os }}-${{ steps.bergamot-submodule.outputs.sha }}-${{ hashFiles('bergamot/src/main/cpp/**', 'third_party/bergamot-translator/**/CMakeLists.txt') }}
          restore-keys: |
            bergamot-cxx-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Write signing config
        run: |
          mkdir -p signing
          echo "${{ secrets.SERIFU_KEYSTORE_BASE64 }}" | base64 -d > signing/serifu-release.jks
          printf 'KEYSTORE_FILE=signing/serifu-release.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=serifu\nKEY_PASSWORD=%s\n' "${{ secrets.SERIFU_SIGNING_PASSWORD }}" "${{ secrets.SERIFU_SIGNING_PASSWORD }}" > .env
          # Fail closed: the decoded keystore must be the backed-up Serifu release key.
          echo "29e0ffdc6be96187fcf78a8422b8acd842c3180c6f400a7236ce5f3443f9c50c  signing/serifu-release.jks" | sha256sum -c -

      - name: Run unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature
        env:
          KS_PASS: ${{ secrets.SERIFU_SIGNING_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/apk-certs.txt
          EXPECTED=$(keytool -list -v -keystore signing/serifu-release.jks -alias serifu -storepass "$KS_PASS" | awk '/SHA256:/{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          ACTUAL=$(awk '/SHA-256 digest:/{print $NF}' /tmp/apk-certs.txt | head -1 | tr 'A-F' 'a-f')
          echo "keystore cert digest: $EXPECTED"
          echo "apk signer digest:    $ACTUAL"
          test -n "$EXPECTED" && test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK signer does not match the Serifu release keystore"; exit 1; }

      - name: Resolve version and tag
        id: versioning
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=serifu-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}, tag: ${TAG}"

      - name: Stage APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "${{ steps.versioning.outputs.apk_name }}"
          ls -la "${{ steps.versioning.outputs.apk_name }}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: serifu-release-apk
          path: ${{ steps.versioning.outputs.apk_name }}
          if-no-files-found: error

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.tag }}
          VERSION: ${{ steps.versioning.outputs.version }}
          APK_NAME: ${{ steps.versioning.outputs.apk_name }}
        run: |
          cat > /tmp/notes.md <<NOTES
          ### Serifu ${VERSION}

          Serifu translates manga, manhua, and manhwa in place on your phone. It screenshots a reader app you choose, finds the speech bubbles, and draws English over them.

          - Japanese, Chinese, and Korean, plus Latin-script sources (English, French, Spanish, German, Italian, Portuguese)
          - On-device translation with ML Kit or Mozilla Bergamot offline models, plus optional OpenAI-compatible cloud backend
          - Auto and manual translate triggers, with a floating HUD over your reader

          ## Install

          1. Download \`${APK_NAME}\` below. Requires Android 11 or newer on an arm64 phone.
          2. Allow installing from this source when Android asks.
          3. On first launch, grant the restricted settings Android requires for sideloaded accessibility apps, then enable Serifu's accessibility service.

          One-time language pack download: ML Kit ~30 MB per language; Bergamot ~20–55 MB per pair.

          Preview / Beta: OCR and lettering may still change between releases. If you installed an earlier build, Android may refuse to install over it because signatures differ; uninstalling the old build resolves this.
          NOTES

          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -Eq "alpha|beta|rc|preview"; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --draft $PRERELEASE_FLAG --title "Serifu ${TAG}" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --draft $PRERELEASE_FLAG --title "Serifu ${TAG}" --notes-file /tmp/notes.md "$APK_NAME"
          fi
