name: Screenshots

on:
  push:
    branches: [main, feat/ui-rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: JVM screen renders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Robolectric 4.17's Android 36 jar requires Java 21. The app still
      # compiles for 17, and the existing CI workflow stays on JDK 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Render screens
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest -Pserifu.screenshots=true -Pserifu.skipNative=true -Proborazzi.test.record=true --no-daemon --stacktrace

      - name: Write gallery
        if: always()
        run: python3 .github/screenshots/gallery.py --allow-missing

      - name: Upload screen renders and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-renders
          if-no-files-found: warn
          path: |
            app/build/outputs/screenshots/
            app/build/reports/tests/
            app/build/test-results/

      - name: Fail if screen images are missing
        if: always()
        run: python3 .github/screenshots/gallery.py --check
