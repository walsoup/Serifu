name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-lint:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /opt/hostedtoolcache/android/1.5.0/x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        id: sdk
        run: |
          SDK=""
          for d in "$ANDROID_HOME" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -n "$d" ] && [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Using SDK at $SDK"

      - name: Accept licences
        run: yes | ${{ steps.sdk.outputs.sdk }}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build + unit tests + lint
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
        run: ./gradlew assembleDebug testDebugUnitTest :core:test lintDebug --console=plain --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  instrumentation:
    name: Emulator checks (AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        id: sdk
        run: |
          SDK=""
          for d in "$ANDROID_HOME" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            if [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          SDK="${SDK:-/usr/local/lib/android/sdk}"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Using SDK at $SDK"

      - name: Accept licences
        run: yes | ${{ steps.sdk.outputs.sdk }}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build test APK
        env:
          ANDROID_HOME: ${{ steps.sdk.outputs.sdk }}
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Run on emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n app.serifu/.ui.MainActivity
            sleep 5
            adb exec-out screencap -p > screenshot-home.png
            # Instrumentation tests once they exist
            # adb shell am instrument -w app.serifu.debug.test/androidx.test.runner.AndroidJUnitRunner

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot*.png
          retention-days: 14
