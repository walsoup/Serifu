name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: '28.0.13004108'
          link-to-sdk: true

      - name: Get Bergamot submodule commit
        id: bergamot-submodule
        run: echo "sha=$(git submodule status third_party/bergamot-translator | awk '{print $1}' | tr -d '+-')" >> $GITHUB_OUTPUT

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            bergamot/.cxx
            bergamot/build
          key: bergamot-cxx-${{ runner.os }}-${{ steps.bergamot-submodule.outputs.sha }}-${{ hashFiles('bergamot/src/main/cpp/**', 'third_party/bergamot-translator/**/CMakeLists.txt') }}
          restore-keys: |
            bergamot-cxx-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Run unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: '28.0.13004108'
          link-to-sdk: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Run Android Lint
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*
          if-no-files-found: ignore

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: '28.0.13004108'
          link-to-sdk: true

      - name: Get Bergamot submodule commit
        id: bergamot-submodule
        run: echo "sha=$(git submodule status third_party/bergamot-translator | awk '{print $1}' | tr -d '+-')" >> $GITHUB_OUTPUT

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            bergamot/.cxx
            bergamot/build
          key: bergamot-cxx-${{ runner.os }}-${{ steps.bergamot-submodule.outputs.sha }}-${{ hashFiles('bergamot/src/main/cpp/**', 'third_party/bergamot-translator/**/CMakeLists.txt') }}
          restore-keys: |
            bergamot-cxx-${{ runner.os }}-

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble Debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: serifu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
